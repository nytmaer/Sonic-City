<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sonic City - A retro-futuristic audio visualizer combining Three.js with Web Audio API">
    <title>Sonic City | Audio Visualizer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --deep-purple: #1a0b2e;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            overflow: hidden; 
            background: #0a0a0a; 
            font-family: 'Rajdhani', sans-serif; 
        }
        
        #canvas-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
        }
        
        /* Glassmorphism UI Panels */
        .glass-panel {
            background: rgba(20, 0, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .glass-panel.hidden-hud {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }
        
        .neon-text {
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
        }
        
        /* Audio Analyzer Bars */
        .analyzer-bar {
            background: linear-gradient(180deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
            box-shadow: 0 0 10px var(--neon-pink);
            transition: height 0.1s ease;
        }
        
        /* Custom Range Inputs */
        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255, 0, 255, 0.2);
            height: 4px;
            border-radius: 2px;
            width: 100%;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--neon-pink);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-pink);
        }
        
        .upload-zone {
            border: 2px dashed var(--neon-pink);
            transition: all 0.3s;
        }
        
        .upload-zone:hover {
            background: rgba(255, 0, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }
        
        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            transition: opacity 0.5s ease;
        }
        
        .zoom-controls.hidden-hud {
            opacity: 0;
            pointer-events: none;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid var(--neon-pink);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-btn:hover {
            background: rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 15px var(--neon-pink);
        }
        
        /* HUD Toggle Button */
        .hud-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 30;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .hud-toggle:hover {
            background: rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        
        /* Hidden State Indicator */
        .hud-indicator {
            position: absolute;
            top: 20px;
            right: 50%;
            transform: translateX(50%);
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            text-shadow: 0 0 10px var(--neon-pink);
            z-index: 25;
        }
        
        .hud-indicator.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HUD Toggle -->
    <button class="hud-toggle" onclick="toggleHUD()" id="hud-btn">Hide HUD [H]</button>
    
    <!-- Hidden HUD Notification -->
    <div class="hud-indicator" id="hud-indicator">HUD Hidden - Press H to Show</div>

    <!-- Zoom Controls -->
    <div class="zoom-controls" id="zoom-controls">
        <button class="zoom-btn" onclick="visualEngine.adjustZoom(-20)" title="Zoom In">+</button>
        <button class="zoom-btn" onclick="visualEngine.adjustZoom(20)" title="Zoom Out">−</button>
        <button class="zoom-btn" onclick="visualEngine.resetZoom()" title="Reset View">⌂</button>
    </div>

    <!-- Main UI Overlay -->
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 flex flex-col justify-between p-6" id="ui-overlay">
        
        <!-- Header -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass-panel px-6 py-4 rounded-lg hud-element">
                <h1 class="text-4xl font-bold text-white font-['Orbitron'] neon-text tracking-wider">SONIC CITY</h1>
                <p class="text-pink-300 text-sm mt-1 tracking-widest uppercase">Audio-Visual Synthesizer</p>
            </div>
            
            <div class="glass-panel px-4 py-2 rounded-lg flex gap-4 text-xs text-cyan-300 font-mono hud-element">
                <div><span class="text-pink-400 font-bold">BPM:</span> <span id="bpm-display">--</span></div>
                <div><span class="text-pink-400 font-bold">FREQ:</span> <span id="freq-display">0</span>Hz</div>
                <div><span class="text-pink-400 font-bold">AMP:</span> <span id="amp-display">0</span>%</div>
                <div><span class="text-pink-400 font-bold">ZOOM:</span> <span id="zoom-display">100</span>%</div>
            </div>
        </div>

        <!-- Center Start Prompt -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none hud-element">
            <div id="start-prompt" class="text-white text-2xl font-['Orbitron'] tracking-widest animate-pulse">
                CLICK TO INITIALIZE
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex gap-6 items-end pointer-events-auto flex-wrap">
            
            <!-- Audio Input -->
            <div class="glass-panel p-6 rounded-lg flex-1 min-w-[300px] max-w-md hud-element">
                <h3 class="text-pink-400 font-['Orbitron'] text-lg mb-4 tracking-wider">Input Source</h3>
                
                <div class="flex gap-2 mb-4">
                    <button onclick="audioEngine.useMicrophone()" class="flex-1 bg-purple-900 hover:bg-purple-700 text-white py-2 px-4 rounded border border-pink-500 transition-all hover:shadow-[0_0_15px_#ff00ff] text-sm font-bold uppercase tracking-wider">
                        Microphone
                    </button>
                    <label class="flex-1 upload-zone bg-transparent text-white py-2 px-4 rounded cursor-pointer text-center text-sm font-bold flex items-center justify-center uppercase tracking-wider">
                        <span>Upload Track</span>
                        <input type="file" accept="audio/*" onchange="audioEngine.loadFile(event)" class="hidden">
                    </label>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between text-xs text-cyan-300 uppercase tracking-wider">
                        <span>Sensitivity</span>
                        <span id="sens-value">1.2</span>
                    </div>
                    <input type="range" min="0.5" max="3" step="0.1" value="1.2" 
                           oninput="visualEngine.sensitivity = this.value; document.getElementById('sens-value').textContent = this.value">
                    
                    <div class="flex justify-between text-xs text-cyan-300 uppercase tracking-wider mt-2">
                        <span>Smoothing</span>
                        <span id="smooth-value">0.8</span>
                    </div>
                    <input type="range" min="0.1" max="0.95" step="0.05" value="0.8" 
                           oninput="audioEngine.analyser.smoothingTimeConstant = this.value; document.getElementById('smooth-value').textContent = this.value">
                </div>
            </div>

            <!-- Frequency Analysis -->
            <div class="glass-panel p-6 rounded-lg flex-1 min-w-[300px] max-w-lg hud-element">
                <h3 class="text-pink-400 font-['Orbitron'] text-lg mb-4 tracking-wider">Frequency Analysis</h3>
                <div class="flex items-end gap-1 h-32" id="analyzer-bars"></div>
                <div class="flex justify-between text-xs text-cyan-300 mt-2 font-mono uppercase">
                    <span>Low</span>
                    <span>Mid</span>
                    <span>Hi</span>
                </div>
            </div>

            <!-- Visual Settings -->
            <div class="glass-panel p-6 rounded-lg w-64 hud-element">
                <h3 class="text-pink-400 font-['Orbitron'] text-lg mb-4 tracking-wider">Visual</h3>
                
                <div class="space-y-3 text-sm">
                    <label class="flex items-center justify-between text-cyan-300 cursor-pointer uppercase tracking-wider text-xs">
                        <span>Grid Floor</span>
                        <input type="checkbox" checked onchange="visualEngine.toggleGrid(this.checked)" class="accent-pink-500 w-4 h-4">
                    </label>
                    <label class="flex items-center justify-between text-cyan-300 cursor-pointer uppercase tracking-wider text-xs">
                        <span>Auto Rotation</span>
                        <input type="checkbox" checked onchange="visualEngine.autoRotate = this.checked" class="accent-pink-500 w-4 h-4">
                    </label>
                    <label class="flex items-center justify-between text-cyan-300 cursor-pointer uppercase tracking-wider text-xs">
                        <span>Particles</span>
                        <input type="checkbox" checked onchange="visualEngine.toggleParticles(this.checked)" class="accent-pink-500 w-4 h-4">
                    </label>
                    
                    <div class="pt-3 border-t border-pink-500/30 mt-3">
                        <div class="flex justify-between text-xs text-cyan-300 mb-1 uppercase tracking-wider">
                            <span>Camera Height</span>
                        </div>
                        <input type="range" min="20" max="150" step="5" value="60" 
                               oninput="visualEngine.adjustHeight(this.value)" class="w-full">
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
/**
 * AudioAnalyzer
 * Handles Web Audio API initialization, microphone/file input, and frequency analysis
 */
class AudioAnalyzer {
    constructor() {
        this.audioContext = null;
        this.analyser = null;
        this.source = null;
        this.dataArray = null;
        this.isPlaying = false;
        this.bpm = 0;
        this.beatHistory = [];
    }

    async init() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        this.analyser = this.audioContext.createAnalyser();
        this.analyser.fftSize = 256;
        this.analyser.smoothingTimeConstant = 0.8;
        
        const bufferLength = this.analyser.frequencyBinCount;
        this.dataArray = new Uint8Array(bufferLength);
        
        document.getElementById('start-prompt').style.display = 'none';
    }

    async useMicrophone() {
        if (!this.audioContext) await this.init();
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            if (this.source) this.source.disconnect();
            
            this.source = this.audioContext.createMediaStreamSource(stream);
            this.source.connect(this.analyser);
            this.isPlaying = true;
            this.detectBeat();
        } catch (err) {
            console.error('Microphone access denied:', err);
            alert('Please allow microphone access to use this feature.');
        }
    }

    async loadFile(event) {
        if (!this.audioContext) await this.init();
        
        const file = event.target.files[0];
        if (!file) return;
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
            
            if (this.source) this.source.disconnect();
            this.source = this.audioContext.createBufferSource();
            this.source.buffer = audioBuffer;
            this.source.connect(this.analyser);
            this.analyser.connect(this.audioContext.destination);
            this.source.start();
            this.isPlaying = true;
            this.detectBeat();
        } catch (err) {
            console.error('Error loading audio:', err);
            alert('Error loading audio file. Please try another format (MP3, WAV).');
        }
    }

    getFrequencyData() {
        if (!this.analyser) return new Uint8Array(128);
        this.analyser.getByteFrequencyData(this.dataArray);
        return this.dataArray;
    }

    getAverageFrequency() {
        const data = this.getFrequencyData();
        return data.reduce((a, b) => a + b, 0) / data.length;
    }

    /**
     * Simple beat detection algorithm for BPM estimation
     * Tracks low frequency energy over time
     */
    detectBeat() {
        setInterval(() => {
            if (!this.isPlaying) return;
            const data = this.getFrequencyData();
            const lowEnd = data.slice(0, 10).reduce((a, b) => a + b) / 10;
            
            this.beatHistory.push(lowEnd);
            if (this.beatHistory.length > 43) this.beatHistory.shift();
            
            const average = this.beatHistory.reduce((a, b) => a + b) / this.beatHistory.length;
            document.getElementById('amp-display').textContent = Math.floor((lowEnd / 255) * 100);
            
            if (lowEnd > average * 1.3 && lowEnd > 100) {
                this.bpm = Math.floor(60000 / (this.beatHistory.length * 23.2));
                document.getElementById('bpm-display').textContent = this.bpm || '--';
            }
        }, 23);
    }

    /**
     * Maps frequency data to 4 zones for building visualization
     * @returns {Object} Frequency zones (sub, bass, mid, high)
     */
    getBuildingData() {
        const data = this.getFrequencyData();
        return {
            sub: data.slice(0, 3).reduce((a, b) => a + b) / 3,
            bass: data.slice(3, 10).reduce((a, b) => a + b) / 7,
            mid: data.slice(10, 40).reduce((a, b) => a + b) / 30,
            high: data.slice(40, 80).reduce((a, b) => a + b) / 40
        };
    }
}

/**
 * VisualEngine
 * Manages Three.js scene, camera, renderer, and visualization objects
 */
class VisualEngine {
    constructor() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.buildingGroups = [];
        this.particles = null;
        this.grid = null;
        this.sun = null;
        this.vinyl = null;
        
        // Settings
        this.sensitivity = 1.2;
        this.autoRotate = true;
        this.rotationSpeed = 0.005;
        this.sunIntensity = 1;
        
        // Camera defaults
        this.baseCameraZ = 140;
        this.baseCameraY = 60;
        this.zoomLevel = 100;
        
        this.init();
    }

    init() {
        // Setup renderer
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        this.renderer.toneMapping = THREE.ReinhardToneMapping;
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        // Camera position - pulled back to see full building peaks
        this.camera.position.set(0, this.baseCameraY, this.baseCameraZ);
        this.camera.lookAt(0, 15, 0);

        // Atmospheric fog
        this.scene.fog = new THREE.FogExp2(0x1a0b2e, 0.008);

        this.createLighting();
        this.createGrid();
        this.createSun();
        this.createVinyl();
        this.createBuildings();
        this.createParticles();

        // Event listeners
        window.addEventListener('wheel', (e) => this.handleWheel(e));
        window.addEventListener('resize', () => this.onResize());
        
        // Start animation loop
        this.animate();
    }

    createLighting() {
        const ambient = new THREE.AmbientLight(0x404040, 0.5);
        this.scene.add(ambient);

        this.sunLight = new THREE.PointLight(0xffaa00, 2, 400);
        this.sunLight.position.set(0, 40, 0);
        this.scene.add(this.sunLight);

        // Rim lighting for synthwave aesthetic
        const rim1 = new THREE.DirectionalLight(0x00ffff, 0.8);
        rim1.position.set(100, 80, 100);
        this.scene.add(rim1);

        const rim2 = new THREE.DirectionalLight(0xff00ff, 0.8);
        rim2.position.set(-100, 80, -100);
        this.scene.add(rim2);
        
        // Top light for building peaks
        const topLight = new THREE.DirectionalLight(0xffffff, 0.3);
        topLight.position.set(0, 100, 0);
        this.scene.add(topLight);
    }

    createGrid() {
        const gridHelper = new THREE.GridHelper(600, 150, 0xff00ff, 0x440066);
        gridHelper.position.y = -30;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        this.scene.add(gridHelper);
        this.grid = gridHelper;

        // Perspective lines
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = -300; i <= 300; i += 40) {
            vertices.push(i, -30, -300, i, -30, 300);
            vertices.push(-300, -30, i, 300, -30, i);
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.LineBasicMaterial({ color: 0xff00ff, opacity: 0.1, transparent: true });
        const lines = new THREE.LineSegments(geometry, material);
        this.scene.add(lines);
    }

    createSun() {
        // Create gradient texture for sunset effect
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        const gradient = ctx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#ffdd00');
        gradient.addColorStop(0.3, '#ff8800');
        gradient.addColorStop(0.6, '#ff0088');
        gradient.addColorStop(1, '#8800ff');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
        
        // Add scanlines
        ctx.globalCompositeOperation = 'overlay';
        for (let i = 0; i < 512; i += 8) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, i, 512, 2);
        }
        
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.MeshBasicMaterial({ 
            map: texture,
            emissive: 0xff6600,
            emissiveIntensity: 0.5
        });
        
        const geometry = new THREE.SphereGeometry(20, 64, 64);
        this.sun = new THREE.Mesh(geometry, material);
        this.sun.position.set(0, 25, -80);
        this.scene.add(this.sun);

        // Glow halo
        const glowGeo = new THREE.SphereGeometry(28, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xff0088,
            transparent: true,
            opacity: 0.3,
            side: THREE.BackSide
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        this.sun.add(glow);
    }

    createVinyl() {
        const geometry = new THREE.CylinderGeometry(80, 80, 2, 128);
        const material = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x220044,
            emissiveIntensity: 0.2
        });
        
        this.vinyl = new THREE.Mesh(geometry, material);
        this.vinyl.position.y = -1;
        this.scene.add(this.vinyl);

        // Groove rings
        for (let i = 25; i < 75; i += 4) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(i, 0.15, 16, 100),
                new THREE.MeshBasicMaterial({ color: 0x6600aa, opacity: 0.4, transparent: true })
            );
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.1;
            this.vinyl.add(ring);
        }
    }

    createBuildings() {
        // 4 rings of buildings mapping to frequency zones
        const rings = [
            { count: 8, radius: 20, height: 15, color: 0xff0088, maxScale: 5 },    // Sub (center)
            { count: 16, radius: 40, height: 20, color: 0x8800ff, maxScale: 4.5 }, // Bass
            { count: 24, radius: 60, height: 25, color: 0x00ffff, maxScale: 4 },   // Mids
            { count: 32, radius: 75, height: 30, color: 0xffdd00, maxScale: 3.5 }  // Highs
        ];

        rings.forEach((ring, ringIndex) => {
            const group = new THREE.Group();
            const buildings = [];
            
            for (let i = 0; i < ring.count; i++) {
                const angle = (i / ring.count) * Math.PI * 2;
                const x = Math.cos(angle) * ring.radius;
                const z = Math.sin(angle) * ring.radius;
                
                const geometry = new THREE.BoxGeometry(4, ring.height, 4);
                geometry.translate(0, ring.height / 2, 0); // Pivot at bottom
                
                const material = new THREE.MeshStandardMaterial({
                    color: ring.color,
                    emissive: ring.color,
                    emissiveIntensity: 0.3,
                    metalness: 0.8,
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.9
                });
                
                const building = new THREE.Mesh(geometry, material);
                building.position.set(x, 0, z);
                building.lookAt(0, 0, 0);
                
                building.userData = {
                    originalHeight: ring.height,
                    maxScale: ring.maxScale,
                    phase: Math.random() * Math.PI * 2
                };
                
                buildings.push(building);
                group.add(building);
            }
            
            this.vinyl.add(group);
            this.buildingGroups.push({ group, buildings, ringIndex });
        });
    }

    createParticles() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        
        for (let i = 0; i < 2000; i++) {
            vertices.push(
                (Math.random() - 0.5) * 600,
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 600
            );
        }
        
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        
        const material = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.8,
            transparent: true,
            opacity: 0.6
        });
        
        this.particles = new THREE.Points(geometry, material);
        this.scene.add(this.particles);
    }

    handleWheel(e) {
        const delta = e.deltaY > 0 ? 5 : -5;
        this.adjustZoom(delta);
    }

    adjustZoom(delta) {
        this.baseCameraZ += delta;
        this.baseCameraZ = Math.max(60, Math.min(300, this.baseCameraZ));
        this.camera.position.z = this.baseCameraZ;
        this.zoomLevel = Math.floor((140 / this.baseCameraZ) * 100);
        document.getElementById('zoom-display').textContent = this.zoomLevel;
    }

    adjustHeight(value) {
        this.baseCameraY = parseInt(value);
        this.camera.position.y = this.baseCameraY;
    }

    resetZoom() {
        this.baseCameraZ = 140;
        this.baseCameraY = 60;
        this.camera.position.set(0, this.baseCameraY, this.baseCameraZ);
        this.camera.lookAt(0, 15, 0);
        this.zoomLevel = 100;
        document.getElementById('zoom-display').textContent = this.zoomLevel;
    }

    updateBuildings(audioData) {
        if (!audioData) return;
        
        const zones = audioEngine.getBuildingData();
        const time = Date.now() * 0.001;

        this.buildingGroups.forEach(({ buildings, ringIndex }) => {
            buildings.forEach((building, i) => {
                let intensity = 0;
                
                // Map ring to frequency zone
                switch(ringIndex) {
                    case 0: intensity = (zones.sub / 255) * this.sensitivity; break;
                    case 1: intensity = (zones.bass / 255) * this.sensitivity; break;
                    case 2: intensity = (zones.mid / 255) * this.sensitivity; break;
                    case 3: intensity = (zones.high / 255) * this.sensitivity; break;
                }
                
                const targetScale = 1 + intensity * (building.userData.maxScale - 1);
                
                // Rotation wave effect
                const angle = (i / buildings.length) * Math.PI * 2 + (this.vinyl.rotation.y * 2);
                const wave = Math.sin(angle * 3 + time * 2) * 0.2;
                
                // Smooth interpolation
                const currentScale = building.scale.y;
                const newScale = currentScale + (targetScale + wave - currentScale) * 0.1;
                
                building.scale.y = Math.max(0.1, newScale);
                building.material.emissiveIntensity = 0.3 + (intensity * 2);
                
                // Flash white on high intensity
                building.material.emissive.setHex(intensity > 0.7 ? 0xffffff : building.material.color.getHex());
            });
        });
    }

    updateAnalyzerUI() {
        if (window.hudHidden) return;
        
        const data = audioEngine.getFrequencyData();
        const container = document.getElementById('analyzer-bars');
        
        // Initialize bars if empty
        if (container.children.length === 0) {
            for (let i = 0; i < 32; i++) {
                const bar = document.createElement('div');
                bar.className = 'analyzer-bar flex-1 rounded-t';
                bar.style.height = '5%';
                container.appendChild(bar);
            }
        }
        
        const bars = container.children;
        const step = Math.floor(data.length / 32);
        
        for (let i = 0; i < 32; i++) {
            const value = data[i * step] || 0;
            const percent = (value / 255) * 100;
            bars[i].style.height = Math.max(5, percent) + '%';
            
            // Color coding by frequency range
            if (i < 8) bars[i].style.background = '#ff0088';
            else if (i < 16) bars[i].style.background = '#8800ff';
            else if (i < 24) bars[i].style.background = '#0088ff';
            else bars[i].style.background = '#00ffff';
        }
        
        // Update dominant frequency display
        const maxVal = Math.max(...data);
        const maxIdx = data.indexOf(maxVal);
        const sampleRate = audioEngine.audioContext?.sampleRate || 44100;
        const fftSize = audioEngine.analyser?.fftSize || 256;
        const dominantFreq = Math.floor(maxIdx * sampleRate / fftSize);
        document.getElementById('freq-display').textContent = dominantFreq;
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        
        const audioData = audioEngine.getFrequencyData();
        
        // Rotate vinyl based on audio energy
        if (this.autoRotate && this.vinyl) {
            const speed = this.rotationSpeed + (audioEngine.getAverageFrequency() / 50000);
            this.vinyl.rotation.y += speed;
        }
        
        this.updateBuildings(audioData);
        
        // Pulse sun with music
        if (this.sun) {
            const pulse = 1 + (audioEngine.getAverageFrequency() / 255) * 0.5;
            this.sun.scale.setScalar(1 + (pulse - 1) * 0.1);
            this.sunLight.intensity = this.sunIntensity * pulse;
        }
        
        // Rotate particles slowly
        if (this.particles) {
            this.particles.rotation.y += 0.0005;
            this.particles.rotation.x += 0.0002;
        }
        
        this.updateAnalyzerUI();
        
        // Subtle camera drift
        const time = Date.now() * 0.0003;
        this.camera.position.x = Math.sin(time) * 10;
        this.camera.lookAt(0, 20, 0);
        
        this.renderer.render(this.scene, this.camera);
    }

    onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }

    toggleGrid(show) {
        if (this.grid) this.grid.visible = show;
    }

    toggleParticles(show) {
        if (this.particles) this.particles.visible = show;
    }
}

// Global HUD state
window.hudHidden = false;

function toggleHUD() {
    window.hudHidden = !window.hudHidden;
    const elements = document.querySelectorAll('.hud-element');
    const zoomControls = document.getElementById('zoom-controls');
    const hudBtn = document.getElementById('hud-btn');
    const indicator = document.getElementById('hud-indicator');
    
    elements.forEach(el => el.classList.toggle('hidden-hud', window.hudHidden));
    
    if (window.hudHidden) {
        zoomControls.classList.add('hidden-hud');
        hudBtn.textContent = 'Show HUD [H]';
        indicator.classList.add('visible');
        setTimeout(() => indicator.classList.remove('visible'), 2000);
    } else {
        zoomControls.classList.remove('hidden-hud');
        hudBtn.textContent = 'Hide HUD [H]';
        indicator.classList.remove('visible');
    }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') toggleHUD();
});

// Initialize engines
const audioEngine = new AudioAnalyzer();
const visualEngine = new VisualEngine();

// Initialize audio context on first click (browser autoplay policy)
document.addEventListener('click', async () => {
    if (!audioEngine.audioContext) {
        await audioEngine.init();
    }
}, { once: true });
</script>
